# Builds the Android APK (mobile/) on GitHub's Ubuntu runners, which come with the JDK and the
# Android SDK. Runs on pushes to the android branch and by hand (Actions → Android APK → Run
# workflow). The APK is attached to the run as an artifact.
#
# The debug build is signed with a debug key kept in the Actions cache (sr-debug-keystore-v1), so successive debug
# APKs install over each other. A release APK is built too when the repository has these
# secrets: SR_KEYSTORE_BASE64 (the keystore, base64), SR_KEYSTORE_PASSWORD, SR_KEY_ALIAS,
# SR_KEY_PASSWORD. The keystore itself never goes into the repository.
name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Debug signing key (kept between runs so updates install over each other)
        uses: actions/cache@v4
        with:
          path: ~/sr-debug.keystore
          key: sr-debug-keystore-v1

      - name: Create the debug key if there is none yet
        run: |
          if [ ! -f ~/sr-debug.keystore ]; then
            keytool -genkeypair -keystore ~/sr-debug.keystore -storepass android -keypass android               -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "SR_DEBUG_KEYSTORE=$HOME/sr-debug.keystore" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Web assets and Capacitor sync
        run: npm run sync

      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the release APK (only with signing secrets)
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.SR_KEYSTORE_BASE64 }}
          SR_KEYSTORE_PASSWORD: ${{ secrets.SR_KEYSTORE_PASSWORD }}
          SR_KEY_ALIAS: ${{ secrets.SR_KEY_ALIAS }}
          SR_KEY_PASSWORD: ${{ secrets.SR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets: release APK skipped"; exit 0; fi
          export SR_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$SR_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$SR_KEYSTORE"

      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l android/app/build/outputs/apk/*/
          # the app must not ship books or library data
          if unzip -l "$APK" | grep -Ei '\.(epub|mobi|azw3?|fb2|cbz)$|library\.json|stats\.json'; then exit 1; fi
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p out
          cp "$APK" "out/SimplyReader-${VERSION}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk "out/SimplyReader-${VERSION}.apk"; fi
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: simply-reader-android
          path: mobile/out/
          retention-days: 30
